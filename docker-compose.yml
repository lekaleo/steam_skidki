services:
  bot:
    build: .
    container_name: steam-skidki-bot
    restart: unless-stopped        # перезапуск при крэше и после перезагрузки сервера
    env_file:
      - .env                        # BOT_TOKEN, CHANNEL, OWNER_ID, SCHEDULE
    environment:
      POST_SCHEDULE: "1"            # этот процесс публикует по расписанию и слушает команды
      NO_COMMANDS: "0"
      TZ: Europe/Moscow
    volumes:
      - ./data:/app/data            # state.db (posted, seen, эмодзи, слоты)
      - ./images:/app/images
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
