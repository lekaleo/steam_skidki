name: listen

# Бот отвечает в Telegram, пока его никто не запускал локально.
# Каждые 5 минут поднимаем окно прослушивания ~4 минуты:
#   • GitHub Actions не умеет держать процесс постоянно, поэтому окна
#   • задержка ответа на команду — до 5 минут (обычно меньше)
#   • общая concurrency-группа с autopost: посты и прослушивание не мешают друг другу

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: steam-telegram
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL: ${{ secrets.CHANNEL }}
      CHANNEL_TITLE: ${{ secrets.CHANNEL_TITLE }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      SCHEDULE: ${{ vars.SCHEDULE }}
      TIMEZONE_OFFSET: "3"
      PREMIUM_EMOJI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Listen for Telegram commands
        run: timeout --signal=INT 250 python run_bot.py --listen 235 || true

      # сохраняем изменения, сделанные командами (/setemoji, захват владельца)
      - name: Persist state.db in repository
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          try:
              c = sqlite3.connect("data/state.db")
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              c.commit()
              c.close()
          except Exception as e:
              print("checkpoint:", e)
          PY
          git config user.name "steam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/state.db
          if git diff --cached --quiet; then
            echo "state.db не изменился"
          else
            git commit -m "state: настройки бота из Telegram [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
