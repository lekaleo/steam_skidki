name: listen

# Бот отвечает в Telegram, когда ПК выключен.
# GitHub Actions не держит процесс постоянно, поэтому каждые 5 минут
# поднимаем окно прослушивания лички ~4 минуты: задержка ответа на команду
# до 5 минут (обычно меньше). Посты публикует отдельный workflow autopost.
# Этот workflow НИЧЕГО не пишет в git — иначе база могла бы сливаться в конфликт.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: steam-listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL: ${{ secrets.CHANNEL }}
      CHANNEL_TITLE: ${{ secrets.CHANNEL_TITLE }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      SCHEDULE: ${{ vars.SCHEDULE }}
      TIMEZONE_OFFSET: "3"
      PREMIUM_EMOJI: "1"
      CAPTION_LIMIT: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      # getMe + deleteWebhook + приём команд (/status /check /post /sync /emojis)
      - name: Listen for Telegram commands
        run: timeout --signal=INT 260 python run_bot.py --listen 245 || true
