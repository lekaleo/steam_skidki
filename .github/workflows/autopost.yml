name: autopost

# Бот работает в облаке круглосуточно, без ПК.
#
# Почему не просто cron: планировщик GitHub на новом репозитории срабатывает
# крайне нерегулярно (проверено: cron */5 за 25 минут — 0 запусков). Поэтому
# каждое окно бота (~3 часа) в конце САМО запускает следующее окно через
# GitHub API — цепочка не прерывается. Cron остаётся страховкой: если цепочка
# оборвалась, он поднимет бота снова.
#
# Внутри окна бот публикует ровно 4 поста в день по слотам (МСК):
#   12:00 multi · 15:00 single · 18:00 news · 21:00 single
# и всё это время слушает команды владельца в личке (/status /check /post ...).

on:
  schedule:
    # страховка на случай обрыва цепочки
    - cron: "0 */3 * * *"
    # слоты публикаций (09/12/15/18 UTC = 12/15/18/21 МСК)
    - cron: "0 9,12,15,18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | single | multi | news | preview-news | probe"
        type: choice
        default: auto
        options:
          - auto
          - single
          - multi
          - news
          - preview-news
          - probe

permissions:
  contents: write
  actions: write      # нужно для самозапуска следующего окна

# auto-окна идут строго по очереди; ручные проверки — отдельной группой
concurrency:
  group: steam-bot-${{ github.event.inputs.mode || 'auto' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL: ${{ secrets.CHANNEL }}
      CHANNEL_TITLE: ${{ secrets.CHANNEL_TITLE }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      SCHEDULE: ${{ vars.SCHEDULE }}
      MIN_DISCOUNT: "15"
      MIN_SCORE: "0"
      MAX_SEARCH_PAGES: "80"
      SYNC_HOURS: "4"
      TIMEZONE_OFFSET: "3"
      PREMIUM_EMOJI: "1"
      CAPTION_LIMIT: "1000"
      MODE: ${{ github.event.inputs.mode || 'auto' }}
    steps:
      - name: Checkout (вместе с data/state.db из репозитория)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore currency rates
        uses: actions/cache@v4
        with:
          path: data/rates.json
          key: steamdb-rates-${{ github.run_id }}
          restore-keys: |
            steamdb-rates-

      - name: Restore fonts
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: steamdb-fonts-v1
          restore-keys: |
            steamdb-fonts-

      - name: Install deps
        run: pip install -r requirements.txt

      # ---------- ручные режимы (для проверок) ----------
      - name: Selfcheck
        if: env.MODE == 'probe'
        run: python run_bot.py --selfcheck

      - name: Publish forced post
        if: env.MODE == 'single' || env.MODE == 'multi' || env.MODE == 'news'
        run: python run_bot.py --force ${{ env.MODE }}

      - name: Preview news (без публикации)
        if: env.MODE == 'preview-news'
        run: python preview_news.py

      # ---------- основное: окно работы бота ----------
      - name: Бот работает (окно ~3 часа)
        if: env.MODE == 'auto'
        run: timeout --signal=INT 11350 python run_bot.py --serve 11200 || true

      - name: Проба цепочки (2 минуты)
        if: env.MODE == 'probe'
        run: timeout --signal=INT 200 python run_bot.py --serve 120 || true

      # ---------- сохранить историю ----------
      - name: Persist state.db in repository
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          try:
              c = sqlite3.connect("data/state.db")
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              c.commit()
              c.close()
          except Exception as e:
              print("checkpoint:", e)
          PY
          test -f data/state.db || exit 0

          git config user.name "steam-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data/state.db /tmp/state.db.new
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.db.new data/state.db
            git add -f data/state.db
            if git diff --cached --quiet; then
              echo "state.db не изменился"
              exit 0
            fi
            git commit -m "state: база опубликованных игр и новостей [skip ci]"
            if git push origin HEAD:main; then
              echo "state.db сохранена в репозитории"
              exit 0
            fi
            sleep 5
          done
          echo "не удалось запушить state.db" >&2
          exit 1

      # ---------- цепочка: следующее окно ----------
      - name: Запустить следующее окно
        if: always() && (env.MODE == 'auto' || env.MODE == 'probe')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run autopost.yml --repo "${{ github.repository }}" -f mode=auto
