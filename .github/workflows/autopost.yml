name: autopost

# Автономная работа без ПК: 4 поста в день по слотам (МСК).
#   • 12:00 multi · 15:00 single · 18:00 news · 21:00 single
#   • 09:00 / 12:00 / 15:00 / 18:00 UTC
#   • data/state.db коммитится обратно в репозиторий после каждого запуска:
#     таблица posted живёт вечно -> игры НИКОГДА не повторяются.

on:
  schedule:
    - cron: "0 9,12,15,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: steam-telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL: ${{ secrets.CHANNEL }}
      CHANNEL_TITLE: ${{ secrets.CHANNEL_TITLE }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      SCHEDULE: ${{ vars.SCHEDULE }}
      MIN_DISCOUNT: "15"
      MIN_SCORE: "0"
      MAX_SEARCH_PAGES: "80"
      SYNC_HOURS: "4"
      TIMEZONE_OFFSET: "3"
      PREMIUM_EMOJI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore currency rates
        uses: actions/cache@v4
        with:
          path: data/rates.json
          key: steamdb-rates-${{ github.run_id }}
          restore-keys: |
            steamdb-rates-

      - name: Restore fonts
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: steamdb-fonts-v1
          restore-keys: |
            steamdb-fonts-

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Selfcheck (только ручной запуск)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python run_bot.py --selfcheck

      - name: Publish one post (если сейчас есть слот)
        run: python run_bot.py --once

      - name: Listen for commands
        continue-on-error: true
        run: timeout --signal=INT 240 python run_bot.py --listen 220 || true

      - name: Persist state.db in repository
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          try:
              c = sqlite3.connect("data/state.db")
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              c.commit()
              c.close()
          except Exception as e:
              print("checkpoint:", e)
          PY
          git config user.name "steam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/state.db
          if git diff --cached --quiet; then
            echo "state.db не изменился"
          else
            git commit -m "state: база опубликованных игр и новостей [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
