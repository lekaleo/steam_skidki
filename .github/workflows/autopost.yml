name: autopost

# Автономная работа без ПК: 4 поста в день по слотам (МСК).
#   • 12:00 multi · 15:00 single · 18:00 news · 21:00 single
#   • cron: 09:00 / 12:00 / 15:00 / 18:00 UTC = 12/15/18/21 МСК
#   • data/state.db коммитится обратно в репозиторий после каждого запуска:
#     таблица posted живёт вечно -> игры НИКОГДА не повторяются.
#   • этот workflow — ЕДИНСТВЕННЫЙ, кто пишет в базу и в Telegram.
#     Команды владельца слушает отдельный workflow listen.yml (только чтение).

on:
  schedule:
    - cron: "0 9,12,15,18 * * *"
  # ручной запуск: auto — как по расписанию; single/multi/news — принудительный
  # пост; preview-news — проверка новости без публикации.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | single | multi | news | preview-news"
        type: choice
        default: auto
        options:
          - auto
          - single
          - multi
          - news
          - preview-news

permissions:
  contents: write

# никаких параллельных запусков: база не может сливаться одновременно
concurrency:
  group: steam-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL: ${{ secrets.CHANNEL }}
      CHANNEL_TITLE: ${{ secrets.CHANNEL_TITLE }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      SCHEDULE: ${{ vars.SCHEDULE }}
      MIN_DISCOUNT: "15"
      MIN_SCORE: "0"
      MAX_SEARCH_PAGES: "80"
      SYNC_HOURS: "4"
      TIMEZONE_OFFSET: "3"
      PREMIUM_EMOJI: "1"
      CAPTION_LIMIT: "1000"
      MODE: ${{ github.event.inputs.mode || 'auto' }}
    steps:
      - name: Checkout (вместе с data/state.db из репозитория)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore currency rates
        uses: actions/cache@v4
        with:
          path: data/rates.json
          key: steamdb-rates-${{ github.run_id }}
          restore-keys: |
            steamdb-rates-

      - name: Restore fonts
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: steamdb-fonts-v1
          restore-keys: |
            steamdb-fonts-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Selfcheck (только при ручном запуске)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python run_bot.py --selfcheck

      # публикует ОДИН пост, если сейчас есть слот (12:00/15:00/18:00/21:00)
      - name: Publish one post (по расписанию)
        if: env.MODE == 'auto'
        run: python run_bot.py --once

      - name: Publish forced post
        if: env.MODE == 'single' || env.MODE == 'multi' || env.MODE == 'news'
        run: python run_bot.py --force ${{ env.MODE }}

      - name: Preview news (без публикации)
        if: env.MODE == 'preview-news'
        run: python preview_news.py

      # база уезжает в репозиторий: история опубликованного хранится навсегда
      - name: Persist state.db in repository
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          try:
              c = sqlite3.connect("data/state.db")
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              c.commit()
              c.close()
          except Exception as e:
              print("checkpoint:", e)
          PY
          test -f data/state.db || exit 0

          git config user.name "steam-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- data/state.db 2>/dev/null && git ls-files --error-unmatch data/state.db >/dev/null 2>&1; then
            echo "state.db не изменился"
            exit 0
          fi

          cp data/state.db /tmp/state.db.new
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.db.new data/state.db
            git add -f data/state.db
            if git diff --cached --quiet; then
              echo "нечего коммитить"
              exit 0
            fi
            git commit -m "state: база опубликованных игр и новостей [skip ci]"
            if git push origin HEAD:main; then
              echo "state.db сохранена в репозитории"
              exit 0
            fi
            sleep 5
          done
          echo "не удалось запушить state.db" >&2
          exit 1
