name: ping

# Диагностика планировщика GitHub: должен запускаться каждые 5 минут.
# Ничего не делает, кроме отметки времени. Удалить после проверки.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Отметка
        run: |
          echo "пинг: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "event: ${{ github.event_name }}"
